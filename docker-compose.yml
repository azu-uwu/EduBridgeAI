services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edubridge-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost
      - AI_MODE=mock
      - AI_TIMEOUT_MS=60000
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=30
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edubridge-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
